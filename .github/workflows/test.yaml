      - name: Install Dependencies
        run: pnpm install
        working-directory: examples/cloudflare-workers-hono

      - name: Install local package
        run: pnpm add @upstash/workflow@file:../../dist
        working-directory: examples/cloudflare-workers-hono

      - name: Run example
        run: npm run dev &
