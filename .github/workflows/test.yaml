  release:
    concurrency: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    needs:
      - cloudflare-workers-local-build
      - cloudflare-workers-hono-local-build
      - express-local-build
      - hono-local-build
      - image-gen-with-workflow-local-build
      - nextjs-local-build
      - nextjs12-node18-local-build
      - nextjs-pages-local-build
      - nuxt-local-build
      # - solidjs-local-build
      - sveltekit-local-build
      - tanstack-start-local-build

    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Get version
        id: version
        run: echo "::set-output name=version::v0.0.0-ci.${GITHUB_SHA}-$(date +%Y%m%d%H%M%S)"

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: latest

      - name: Set version
        run: |
          echo $(jq --arg v "${{ steps.version.outputs.version }}" '(.version) = $v' package.json) > package.json

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish ci version
        run: npm publish --provenance --tag=ci --verbose
        working-directory: ./dist

      # npm can take several minutes to serve a new version after publish, so wait
      # up to 15 minutes. --prefer-online skips npm's local metadata cache, which
      # could otherwise hide a version that has already landed.
      - name: Wait for npm to serve the ci version
        shell: bash
        timeout-minutes: 16
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION="${VERSION#v}"
          for i in $(seq 1 90); do
            if npm view "@upstash/workflow@${VERSION}" version --prefer-online >/dev/null 2>&1; then
              echo "@upstash/workflow@${VERSION} is available on npm"
              exit 0
            fi
            echo "waiting for @upstash/workflow@${VERSION} to appear on npm ($i/90)..."
            sleep 10
          done
          echo "::error::@upstash/workflow@${VERSION} not visible on npm after 15 minutes"
          exit 1

  integration-test:
    concurrency: integration-test
    runs-on: ubuntu-latest
    needs:
      - release
    steps:
      - name: Setup repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
